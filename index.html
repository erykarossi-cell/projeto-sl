<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Conta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Acessar Conta</h2>

        <div class="form-group">
            <label for="usuario">Login</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário ou e-mail">
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>

        <button type="button" class="btn-principal" id="btnConfirmar">Confirmar</button>
        
        <a href="cadastro.html" class="btn-secundario">Criar Conta</a>

        <div class="mensagem" id="mensagemFeedback"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
