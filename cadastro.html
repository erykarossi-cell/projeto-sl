<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    < class="card">
        <h2> Criar Conta </h2>

        <div class="form-group">
            <label for="nome"> Nome completo </label>
            <input type="text" id="nome" placeholder="digite seu nome">
        </div>
        <div class="form-group">
            <label for="nascimento"> Data de nascimento </label>
            <input type="date" id="nascimento">
        </div>

        <div class="form-group">
            <label for="cpf"> CPF </label>
            <input type="text" id="cpf" placeholder="000.000.000-00">
        </div>
        <div class="form-group">
            <label for="telefone"> Telefone </label>
            <input type="tel" id="telefone" placeholder="digite seu número">
        </div>
        <div class="form-group">
            <label for="email"> Email </label>
            <input type="email" id="email" placeholder="digite seu E-mail">
        </div>

        <button type="button" class="btn-principal" id="btnsalvar"> Cadastrar</button>
        <a href="index.html" class="btn-secundario">Voltar para o Login</a>

        <div class="mensagem" id="mensagemCadastro"></div>
    </div>
</body>
</html>
